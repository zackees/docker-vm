name: docker-vm

# No desktop/VNC port is published. The native viewer discovers the ephemeral
# container address and owns the loopback-only authenticated RFB bridge.
services:
  desktop:
    build:
      context: .
      dockerfile: images/desktop/Dockerfile
    image: docker-vm-desktop:local
    user: "${SESSION_UID:?the private viewer must set the session UID}:${SESSION_GID:?the private viewer must set the session GID}"
    read_only: true
    init: true
    restart: "no"
    cap_drop: ["ALL"]
    security_opt:
      # Chromium's own setuid/namespace sandbox creates the renderer sandbox.
      # Docker's default seccomp policy blocks that namespace setup, while
      # no-new-privileges prevents the setuid helper from doing its job.
      - seccomp=unconfined
    # Chromium tabs create processes and many threads. 512 exhausted under a
    # multi-tab workload; retain a finite guard with room for desktop/debugger.
    pids_limit: 2048
    ulimits:
      core: 0
    # Graphics-heavy tabs exhausted 512 MiB without a cgroup OOM event.
    # This is a ceiling, not an upfront allocation; keep shared memory private.
    shm_size: 2g
    environment:
      HOME: /home/desktop
      XDG_RUNTIME_DIR: /run/user/1000
      XDG_CACHE_HOME: /home/desktop/.cache
      XDG_CONFIG_HOME: /home/desktop/.config
      XDG_DATA_HOME: /home/desktop/.local/share
      CHROMIUM_USER_DATA_DIR: /home/desktop/.config/chromium
      VNC_PASSWORD_FILE: /run/session/vnc-password
      LIBGL_ALWAYS_SOFTWARE: "1"
    volumes:
      - type: bind
        source: ${SESSION_RUNTIME_DIR:?the private viewer must create a verified tmpfs session directory}
        target: /run/session
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /home/desktop:uid=${SESSION_UID:?},gid=${SESSION_GID:?},mode=700,size=1024m
      - /run/user/1000:uid=${SESSION_UID:?},gid=${SESSION_GID:?},mode=700,size=64m
      - /tmp:mode=1777,size=256m
      - /var/tmp:mode=1777,size=64m
      - /var/cache:mode=755,size=64m
    logging:
      driver: none
