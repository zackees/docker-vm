name: configuration

on:
  pull_request:
  push:
    branches: [main]

# One live run per workflow per ref: a new push to a branch or PR cancels the
# superseded run instead of queuing behind it in the shared account-wide runner
# pool. Runs on main get a unique group, so they are never cancelled or coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate first-run configuration without a GPU
        run: ./scripts/test-configure
      - name: Validate diagnostics behavior
        run: ./tests/validation.sh
      - name: Validate shell syntax
        run: find scripts -maxdepth 1 -type f -print0 | xargs -0 bash -n
