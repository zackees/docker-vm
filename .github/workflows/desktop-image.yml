name: desktop image

# Publishes the desktop container image so viewers pull it instead of
# building it locally. The tag is the source fingerprint the viewer computes
# (scripts/image-fingerprint), so a viewer only ever pulls an image built from
# exactly its own images/desktop sources.
on:
  push:
    branches: [main]
    paths:
      - images/desktop/**
      - scripts/image-fingerprint
      - .github/workflows/desktop-image.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zackees/docker-vm-desktop

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compute source fingerprint
        id: source
        run: echo "fingerprint=$(./scripts/image-fingerprint)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this fingerprint is already published
        id: existing
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.source.outputs.fingerprint }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.published == 'false'

      - name: Build and push
        if: steps.existing.outputs.published == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/desktop/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.source.outputs.fingerprint }}
            ${{ env.IMAGE }}:latest
          labels: |
            docker-vm.source=${{ steps.source.outputs.fingerprint }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
