[package]
name = "docker-vm-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { git = "https://github.com/tauri-apps/tauri.git", rev = "fe0e515" }

[dependencies]
base64 = "0.22"
# Pure Rust; without libfuse it drives the setuid fusermount3 helper.
fuser = "0.18"
futures-util = "0.3"
getrandom = "0.3"
gstreamer = "0.21"
gstreamer-app = "0.21"
gstreamer-video = "0.21"
gtk = "0.18"
http = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { git = "https://github.com/tauri-apps/tauri.git", rev = "fe0e515", features = ["unstable"] }
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri.git", rev = "fe0e515" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
tokio-tungstenite = "0.28"
uuid = { version = "1", features = ["v4"] }
# Read-only archive support: AES and ZipCrypto decryption, pure-Rust codecs.
zip = { version = "8.6", default-features = false, features = ["aes-crypto", "bzip2", "deflate-flate2-zlib-rs", "deflate64", "lzma"] }
