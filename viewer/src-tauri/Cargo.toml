[package]
name = "docker-vm-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { git = "https://github.com/tauri-apps/tauri.git", rev = "fe0e515" }

[dependencies]
base64 = "0.22"
futures-util = "0.3"
getrandom = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
tauri = { git = "https://github.com/tauri-apps/tauri.git", rev = "fe0e515", features = ["unstable"] }
tauri-runtime-cef = { git = "https://github.com/tauri-apps/tauri.git", rev = "fe0e515" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
tokio-tungstenite = "0.28"
uuid = { version = "1", features = ["v4"] }
